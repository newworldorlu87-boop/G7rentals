{% extends 'accounts/base.html' %}

{% block content %}
<div class="booking-container">
    <article class="booking-card">
        <header class="booking-header">
            <h1 class="booking-title">Book Property</h1>
            <div class="property-summary">
                <h2 class="property-name">{{ property.title }}</h2>
                <p class="property-location">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/>
                        <circle cx="12" cy="10" r="3"/>
                    </svg>
                    {{ property.city }}
                </p>
                <p class="property-price">
                    <span class="currency">₦</span>{{ property.price }}
                    <span class="period">/night</span>
                </p>
            </div>
        </header>

        <form method="POST" class="booking-form" id="bookingForm">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="start_date" class="form-label">
                    Check-in Date
                </label>
                <input 
                    type="date" 
                    id="start_date"
                    name="start_date" 
                    class="form-input"
                    required
                    min="{% now 'Y-m-d' %}"
                    aria-required="true"
                >
            </div>

            <div class="form-group">
                <label for="end_date" class="form-label">
                    Check-out Date
                </label>
                <input 
                    type="date" 
                    id="end_date"
                    name="end_date" 
                    class="form-input"
                    required
                    min="{% now 'Y-m-d' %}"
                    aria-required="true"
                >
            </div>

            <div class="booking-summary" id="bookingSummary" aria-live="polite">
                <!-- Populated via JS -->
            </div>

            <button type="submit" class="btn btn-primary btn-full">
                <span class="btn-text">Confirm Booking</span>
                <svg class="icon icon-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M5 12h14M12 5l7 7-7 7"/>
                </svg>
            </button>
        </form>
    </article>
</div>

<style>
/* CSS Variables for theming */
:root {
    --color-primary: #2563eb;
    --color-primary-hover: #1d4ed8;
    --color-primary-active: #1e40af;
    --color-success: #059669;
    --color-text: #1f2937;
    --color-text-secondary: #6b7280;
    --color-border: #e5e7eb;
    --color-border-focus: #3b82f6;
    --color-bg: #f3f4f6;
    --color-surface: #ffffff;
    --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
    --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
    --radius: 0.75rem;
    --radius-lg: 1rem;
    --transition: 150ms cubic-bezier(0.4, 0, 0.2, 1);
}

.booking-container {
    max-width: 28rem;
    margin: 3rem auto;
    padding: 0 1rem;
}

.booking-card {
    background: var(--color-surface);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-lg);
    overflow: hidden;
}

.booking-header {
    padding: 1.5rem 2rem;
    background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-primary-hover) 100%);
    color: white;
}

.booking-title {
    font-size: 1.5rem;
    font-weight: 700;
    margin: 0 0 1rem 0;
    letter-spacing: -0.025em;
}

.property-summary {
    padding-top: 1rem;
    border-top: 1px solid rgba(255, 255, 255, 0.2);
}

.property-name {
    font-size: 1.125rem;
    font-weight: 600;
    margin: 0 0 0.5rem 0;
}

.property-location {
    display: flex;
    align-items: center;
    gap: 0.375rem;
    margin: 0 0 0.75rem 0;
    opacity: 0.9;
    font-size: 0.875rem;
}

.property-price {
    font-size: 1.5rem;
    font-weight: 700;
    margin: 0;
}

.property-price .currency {
    font-size: 1rem;
    vertical-align: super;
}

.property-price .period {
    font-size: 0.875rem;
    font-weight: 400;
    opacity: 0.8;
}

.booking-form {
    padding: 2rem;
}

.form-group {
    margin-bottom: 1.25rem;
}

.form-label {
    display: block;
    font-size: 0.875rem;
    font-weight: 500;
    color: var(--color-text);
    margin-bottom: 0.5rem;
}

.form-input {
    width: 100%;
    padding: 0.75rem 1rem;
    font-size: 1rem;
    color: var(--color-text);
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: var(--radius);
    transition: border-color var(--transition), box-shadow var(--transition);
    box-sizing: border-box;
}

.form-input:hover {
    border-color: #d1d5db;
}

.form-input:focus {
    outline: none;
    border-color: var(--color-border-focus);
    box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
}

.form-input:invalid:not(:placeholder-shown) {
    border-color: #ef4444;
}

.booking-summary {
    margin: 1.5rem 0;
    padding: 1rem;
    background: var(--color-bg);
    border-radius: var(--radius);
    font-size: 0.875rem;
    display: none;
}

.booking-summary.active {
    display: block;
}

.btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    padding: 0.875rem 1.5rem;
    font-size: 1rem;
    font-weight: 600;
    line-height: 1.5;
    border: none;
    border-radius: var(--radius);
    cursor: pointer;
    transition: background-color var(--transition), transform var(--transition), box-shadow var(--transition);
}

.btn-primary {
    background: var(--color-primary);
    color: white;
    box-shadow: var(--shadow-sm);
}

.btn-primary:hover {
    background: var(--color-primary-hover);
    box-shadow: var(--shadow-md);
    transform: translateY(-1px);
}

.btn-primary:active {
    background: var(--color-primary-active);
    transform: translateY(0);
}

.btn-full {
    width: 100%;
}

.icon {
    width: 1.25rem;
    height: 1.25rem;
    flex-shrink: 0;
}

.icon-right {
    margin-left: auto;
}

/* Accessibility */
@media (prefers-reduced-motion: reduce) {
    * {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
    }
}

/* Focus visible for keyboard navigation */
.form-input:focus-visible,
.btn:focus-visible {
    outline: 2px solid var(--color-border-focus);
    outline-offset: 2px;
}
</style>

<script>
(function() {
    const startDate = document.getElementById('start_date');
    const endDate = document.getElementById('end_date');
    const summary = document.getElementById('bookingSummary');
    const pricePerNight = parseFloat('{{ property.price }}'.replace(/[^0-9.]/g, '')) || 0;

    function updateSummary() {
        if (!startDate.value || !endDate.value) {
            summary.classList.remove('active');
            return;
        }

        const start = new Date(startDate.value);
        const end = new Date(endDate.value);
        const nights = Math.ceil((end - start) / (1000 * 60 * 60 * 24));

        if (nights > 0) {
            const total = (nights * pricePerNight).toLocaleString('en-NG');
            summary.innerHTML = `
                <div style="display:flex; justify-content:space-between; margin-bottom:0.5rem;">
                    <span>${nights} night${nights !== 1 ? 's' : ''}</span>
                    <span>₦${(nights * pricePerNight).toLocaleString('en-NG')}</span>
                </div>
                <div style="display:flex; justify-content:space-between; font-weight:600; border-top:1px solid #d1d5db; padding-top:0.5rem;">
                    <span>Total</span>
                    <span>₦${total}</span>
                </div>
            `;
            summary.classList.add('active');
        } else {
            summary.classList.remove('active');
        }
    }

    startDate.addEventListener('change', function() {
        endDate.min = this.value;
        if (endDate.value && endDate.value < this.value) {
            endDate.value = this.value;
        }
        updateSummary();
    });

    endDate.addEventListener('change', updateSummary);

    document.getElementById('bookingForm').addEventListener('submit', function(e) {
        const btn = this.querySelector('button[type="submit"]');
        btn.disabled = true;
        btn.querySelector('.btn-text').textContent = 'Processing...';
    });
})();
</script>
{% endblock %}
