{% extends 'accounts/base.html' %}

{% block content %}

<style>

body{
    background:#f4f6f9;
    font-family:Arial,sans-serif;
}

.chat-container{
    max-width:900px;
    margin:30px auto;
    background:white;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 5px 20px rgba(0,0,0,0.08);
}

.chat-header{
    background:#6f42c1;
    color:white;
    padding:20px;
}

.chat-property{
    background:#fafafa;
    padding:15px 20px;
    border-bottom:1px solid #eee;
}

.chat-messages{
    height:500px;
    overflow-y:auto;
    padding:20px;
}

.message{
    margin-bottom:15px;
    display:flex;
}

.sent{
    justify-content:flex-end;
}

.received{
    justify-content:flex-start;
}

.bubble{
    max-width:70%;
    padding:14px 18px;
    border-radius:18px;
}

.sent .bubble{
    background:#6f42c1;
    color:white;
}

.received .bubble{
    background:#e5e7eb;
}

.time{
    font-size:11px;
    margin-top:5px;
    opacity:0.7;
}

.chat-form{
    display:flex;
    gap:10px;
    padding:20px;
    border-top:1px solid #eee;
}

.chat-form input{
    flex:1;
    padding:14px;
    border:1px solid #ddd;
    border-radius:10px;
}

.chat-form button{
    background:#6f42c1;
    color:white;
    border:none;
    padding:14px 20px;
    border-radius:10px;
    cursor:pointer;
}

</style>

<div class="chat-container">

    <div class="chat-header">

        <h2>
            Chat with {{ other_user.username }}
        </h2>

    </div>

    <div class="chat-property">

        <strong>
            Property:
        </strong>

        {{ property.title }}

    </div>

    <div class="chat-messages">

        {% for msg in chats %}

            <div class="message {% if msg.sender == request.user %}sent{% else %}received{% endif %}">

                <div class="bubble">

                    {{ msg.message }}

                    <div class="time">

                        {{ msg.created_at|date:"M d, H:i" }}

                    </div>

                </div>

            </div>

        {% empty %}

            <p>No messages yet.</p>

        {% endfor %}

    </div>

    <form method="POST"
          class="chat-form">

        {% csrf_token %}

        {{ form.message }}

        <button type="submit">

            Send

        </button>

    </form>

</div>

{% endblock %}
