{% extends 'accounts/base.html' %}

{% block content %}

<style>
.container {
    max-width: 400px;
    margin: 60px auto;
    padding: 30px;
    background: white;
    border-radius: 12px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.1);
}

h2 {
    text-align: center;
    margin-bottom: 20px;
}

.form-group {
    margin-bottom: 15px;
}

input, select {
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #ccc;
}

button {
    width: 100%;
    padding: 12px;
    border: none;
    background: #28a745;
    color: white;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
}

button:hover {
    background: #218838;
}

.error {
    color: red;
    font-size: 14px;
}
</style>

<div class="container">
    <h2>Create Account</h2>

    <!-- Form Errors -->
    {% if form.errors %}
        <div class="error">
            {{ form.errors }}
        </div>
    {% endif %}

    <form method="post">
        {% csrf_token %}

        <div class="form-group">
            <label>Full Name (Surname First)</label>
            {{ form.username }}
        </div>

        <div class="form-group">
            <label>Email</label>
            {{ form.email }}
        </div>

        <div class="form-group">
            <label>User Type</label>
            {{ form.user_type }}
        </div>

        <div class="form-group">
            <label>Password</label>
            {{ form.password1 }}
        </div>

        <div class="form-group">
            <label>Confirm Password</label>
            {{ form.password2 }}
        </div>

        <button type="submit">Register</button>
    </form>

    <p style="text-align:center; margin-top:15px;">
        Already have an account?
        <a href="{% url 'login' %}">Login</a>
    </p>
</div>

{% endblock %}
