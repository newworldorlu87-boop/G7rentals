{% extends 'accounts/base.html' %}

{% block content %}

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#f4f6f9;
    overflow-x:hidden;
}

/* WRAPPER */
.login-wrapper{
    display:flex;
    min-height:100vh;
    width:100%;
}

/* LEFT IMAGE */
.login-image{
    flex:1;
    background:
    linear-gradient(rgba(0,0,0,0.35),rgba(0,0,0,0.35)),
    url('https://images.unsplash.com/photo-1507089947368-19c1da9775ae');

    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
}

/* RIGHT SIDE */
.login-container{
    flex:1;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    background:#f4f6f9;
}

/* LOGIN CARD */
.login-card{
    width:100%;
    max-width:420px;

    background:rgba(255,255,255,0.95);

    padding:40px;

    border-radius:20px;

    box-shadow:0 20px 50px rgba(0,0,0,0.12);

    backdrop-filter:blur(10px);

    transition:0.3s ease;
}

.login-card:hover{
    transform:translateY(-3px);
}

/* TITLE */
.login-card h2{
    text-align:center;
    margin-bottom:8px;
    font-size:32px;
    color:#111827;
}

.sub-text{
    text-align:center;
    font-size:14px;
    color:#777;
    margin-bottom:30px;
    line-height:1.5;
}

/* ERROR */
.error{
    color:#ff4d4d;
    text-align:center;
    margin-bottom:15px;
    font-size:13px;
    background:#ffecec;
    padding:10px;
    border-radius:10px;
}

/* INPUT GROUP */
.input-group{
    position:relative;
    margin-bottom:18px;
}

/* INPUT */
.input-group input{
    width:100%;
    padding:14px 50px 14px 14px;

    border-radius:12px;
    border:1px solid #ddd;

    outline:none;

    font-size:14px;

    transition:0.3s ease;

    background:white;
}

.input-group input:focus{
    border-color:#28a745;
    box-shadow:0 0 0 3px rgba(40,167,69,0.1);
}

/* PASSWORD TOGGLE */
.toggle-password{
    position:absolute;
    right:15px;
    top:50%;
    transform:translateY(-50%);
    cursor:pointer;
    font-size:13px;
    color:#555;
    user-select:none;
    font-weight:bold;
}

/* BUTTON */
button{
    width:100%;
    padding:14px;

    border:none;

    background:linear-gradient(135deg,#28a745,#218838);

    color:white;

    border-radius:12px;

    font-size:15px;
    font-weight:bold;

    cursor:pointer;

    transition:0.3s ease;
}

button:hover{
    transform:translateY(-2px);
    opacity:0.95;
}

/* REGISTER LINK */
.login-card a{
    display:block;
    text-align:center;
    margin-top:20px;
    color:#28a745;
    text-decoration:none;
    font-size:14px;
    font-weight:500;
}

.login-card a:hover{
    text-decoration:underline;
}

/* MOBILE */
@media(max-width:900px){

    .login-wrapper{
        flex-direction:column;
    }

    .login-image{
        height:250px;
        flex:none;
    }

    .login-container{
        padding:20px;
    }

}

/* SMALL DEVICES */
@media(max-width:600px){

    .login-image{
        display:none;
    }

    .login-container{
        min-height:100vh;
        padding:15px;
    }

    .login-card{
        padding:30px 20px;
        border-radius:16px;
    }

    .login-card h2{
        font-size:26px;
    }

    .sub-text{
        font-size:13px;
    }

    .input-group input{
        padding:13px 45px 13px 13px;
        font-size:14px;
    }

    button{
        padding:13px;
        font-size:14px;
    }

}

/* EXTRA SMALL */
@media(max-width:400px){

    .login-card{
        padding:25px 18px;
    }

    .login-card h2{
        font-size:22px;
    }

    .sub-text{
        font-size:12px;
    }

}

</style>

<div class="login-wrapper">

    <!-- LEFT IMAGE -->
    <div class="login-image"></div>

    <!-- RIGHT FORM -->
    <div class="login-container">

        <div class="login-card">

            <h2>Welcome Back</h2>

            <div class="sub-text">
                Login to your account and continue managing your rentals
            </div>

            {% if messages %}

                {% for message in messages %}

                    <div class="error">
                        {{ message }}
                    </div>

                {% endfor %}

            {% endif %}

            <form method="post">

                {% csrf_token %}

                <!-- EMAIL -->
                <div class="input-group">

                    <input type="email"
                           name="email"
                           placeholder="Email address"
                           required>

                </div>

                <!-- PASSWORD -->
                <div class="input-group">

                    <input type="password"
                           name="password"
                           id="password"
                           placeholder="Password"
                           required>

                    <span class="toggle-password"
                          onclick="togglePassword()">

                          Show

                    </span>

                </div>

                <!-- BUTTON -->
                <button type="submit">

                    Login

                </button>

            </form>

            <!-- REGISTER -->
            <a href="{% url 'register' %}">

                Don't have an account? Register

            </a>

        </div>

    </div>

</div>

<script>

function togglePassword(){

    const input =
        document.getElementById("password");

    const toggle =
        document.querySelector(".toggle-password");

    if(input.type === "password"){

        input.type = "text";

        toggle.textContent = "Hide";

    }else{

        input.type = "password";

        toggle.textContent = "Show";
    }
}

</script>

{% endblock %}
